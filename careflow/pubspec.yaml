name: careflow
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.1
  firebase_auth: ^5.5.0
  permission_handler: ^11.3.1
  intl: ^0.20.2
  google_maps_flutter: ^2.12.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  flutter_native_splash: ^2.4.7
  provider: ^6.1.5+1
  uuid: ^4.5.3
  shared_preferences: ^2.5.6
  google_sign_in: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
    - assets/animations/

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#2563EB"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.png

flutter_native_splash:
  color: "#F6F8FC"
  image: assets/branding/careflow_logo.png
  android_12:
    color: "#F6F8FC"
    image: assets/branding/careflow_logo.png
